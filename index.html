function sha256(s){const P=[];for(let c=2;P.length<64;c++)if(P.every(p=>c%p))P.push(c);const fr=x=>(x%1)*4294967296>>>0,K=P.map(p=>fr(Math.cbrt(p)));let h=P.slice(0,8).map(p=>fr(Math.sqrt(p)));const by=new TextEncoder().encode(s),l=by.length,n=(l+9+63>>6)<<6,w=new Uint8Array(n);w.set(by);w[l]=128;const dv=new DataView(w.buffer);dv.setUint32(n-8,Math.floor(l*8/4294967296));dv.setUint32(n-4,l*8>>>0);const R=(x,k)=>x>>>k|x<<32-k,W=new Uint32Array(64);for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const s0=W[i-15],s1=W[i-2];W[i]=W[i-16]+(R(s0,7)^R(s0,18)^s0>>>3)+W[i-7]+(R(s1,17)^R(s1,19)^s1>>>10)|0}let[a,b,c,d,e,f,g,q]=h;for(let i=0;i<64;i++){const t1=q+(R(e,6)^R(e,11)^R(e,25))+(e&f^~e&g)+K[i]+W[i]|0,t2=(R(a,2)^R(a,13)^R(a,22))+(a&b^a&c^b&c)|0;q=g;g=f;f=e;e=d+t1|0;d=c;c=b;b=a;a=t1+t2|0}h=h.map((v,i)=>v+[a,b,c,d,e,f,g,q][i]|0)}return h.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("")}
function hashPw(pw){const salt=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>x.toString(16).padStart(2,"0")).join("");return"h1$"+salt+"$"+sha256(salt+pw)}
function checkPw(pw,st){if(!st)return false;if(st.startsWith("h1$")){const p=st.split("$");return sha256(p[1]+pw)===p[2]}return st===pw}
function normPhone(s){let d=en(s).replace(/[\s\-()]/g,"");if(d.startsWith("+98"))d=d.slice(3);else if(d.startsWith("0098"))d=d.slice(4);else if(d.startsWith("98")&&d.length===12)d=d.slice(2);else if(d.startsWith("0"))d=d.slice(1);return/^9(0[0-5]|1\d|2[0-2]|3\d|41|9\d)\d{7}$/.test(d)&&!/(\d)\1{6,}/.test(d)?"+98"+d:""}

function pwRules(p){return[["حداقل ۸ کاراکتر",p.length>=8],["حرف بزرگ انگلیسی",/[A-Z]/.test(p)],["حرف کوچک انگلیسی",/[a-z]/.test(p)],["عدد",/\d/.test(p)],["نماد مثل @ ! #",/[^A-Za-z0-9]/.test(p)]]}
function pwProblem(p,un){const r=pwRules(p).find(x=>!x[1]);if(r)return"رمز باید این مورد را داشته باشد: "+r[0];if(!/^[\x21-\x7E]+$/.test(p))return"فقط حروف انگلیسی، عدد و نماد (بدون فاصله و فارسی)";if(un&&p.toLowerCase().includes(un.toLowerCase()))return"رمز نباید شامل نام کاربری باشد";if(COMMON_PW.some(c=>p.toLowerCase().includes(c)))return"این رمز خیلی رایج است؛ رمز دیگری بساز";return""}
