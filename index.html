<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi — آشنایی جدید</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#faf9fa;
  --card:#ffffff;
  --text:#211d21;
  --muted:#8d838b;
  --line:#eee8ec;
  --accent:#e85b86;
  --soft:#f8edf2;
  --dark:#211e21;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:75px;
  transition:.25s;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  height:65px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:30;
  background:#ffffffee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.logo{
  color:var(--accent);
  font-size:25px;
  font-weight:900;
}

.auth-btn{
  border:0;
  background:var(--dark);
  color:white;
  padding:9px 16px;
  border-radius:22px;
  font-size:12px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  text-align:center;
  padding:55px 6% 35px;
}

.hero-label{
  color:#94707d;
  font-size:10px;
  letter-spacing:2px;
  font-weight:bold;
  margin-bottom:16px;
}

.hero h1{
  font-size:clamp(40px,9vw,68px);
  line-height:1.08;
  letter-spacing:-2px;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  max-width:520px;
  margin:18px auto;
  color:var(--muted);
  line-height:1.9;
  font-size:14px;
}

.container{
  max-width:680px;
  margin:auto;
  padding:25px 6%;
}

.title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.title h2{
  font-size:24px;
}

.card,
.box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 10px 35px rgba(30,15,25,.05);
}

.discover-card{
  overflow:hidden;
}

.photo{
  height:360px;
  background:linear-gradient(145deg,#f2e8ed,#e9e4f3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:105px;
}

.info{
  padding:19px;
}

.name{
  font-size:22px;
  font-weight:800;
}

.meta{
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}

.bio{
  color:#625961;
  line-height:1.8;
  font-size:13px;
  margin-top:12px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px;
}

.tag{
  background:var(--soft);
  color:#765763;
  border:1px solid #eee1e7;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
}

.actions{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:18px;
}

.action{
  width:54px;
  height:54px;
  border-radius:50%;
  background:white;
  border:1px solid var(--line);
  box-shadow:0 7px 20px rgba(30,15,25,.08);
  font-size:20px;
}

.action.like{
  color:var(--accent);
}

.action.star{
  color:#8065d8;
}

.action.pass{
  color:#777;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.match,
.chat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.avatar{
  width:58px;
  height:58px;
  flex:none;
  border-radius:50%;
  background:linear-gradient(145deg,#f1dce5,#e1dff0);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.muted{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.center{
  text-align:center;
}

.profile-box{
  padding:22px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile-head .avatar{
  width:72px;
  height:72px;
  font-size:34px;
}

.primary{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:13px;
  background:var(--dark);
  color:white;
  font-weight:bold;
}

.settings{
  margin-top:14px;
  padding:10px 17px;
}

.settings-title{
  font-size:14px;
  font-weight:bold;
  padding:8px 0 5px;
}

.setting{
  width:100%;
  border:0;
  border-bottom:1px solid var(--line);
  background:none;
  padding:15px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--text);
  font-size:13px;
  text-align:right;
}

.setting:last-child{
  border-bottom:0;
}

.setting span:last-child{
  color:#aaa0a8;
  font-size:18px;
}

.setting.danger{
  color:#bd4d6d;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  z-index:40;
  background:#ffffffef;
  backdrop-filter:blur(15px);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
}

.bottom button{
  border:0;
  background:none;
  color:#958b94;
  font-size:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.bottom button span{
  font-size:20px;
}

.bottom button.active{
  color:var(--accent);
}

.modal{
  position:fixed;
  inset:0;
  background:#160d1380;
  z-index:100;
  display:none;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:25px 25px 0 0;
  padding:25px;
  margin:auto auto 0;
}

.close{
  float:left;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#f2edf0;
}

.form{
  display:grid;
  gap:12px;
  margin-top:20px;
}

.input,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  outline:none;
  background:white;
  color:#222;
}

.input:focus,
textarea:focus{
  border-color:var(--accent);
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.chatbox{
  height:350px;
  overflow:auto;
  background:#faf6f8;
  border-radius:17px;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:18px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:16px;
  font-size:13px;
  line-height:1.6;
}

.message.mine{
  align-self:flex-start;
  background:var(--accent);
  color:white;
  border-bottom-left-radius:5px;
}

.message.theirs{
  align-self:flex-end;
  background:#ebe6e9;
  color:#292329;
  border-bottom-right-radius:5px;
}

.toast{
  position:fixed;
  z-index:200;
  bottom:90px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  background:#292329;
  color:white;
  padding:12px 18px;
  border-radius:30px;
  font-size:12px;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* DARK MODE */

body.dark{
  --bg:#171517;
  --card:#211e21;
  --text:#f5f1f3;
  --muted:#aaa0a8;
  --line:#373237;
  --soft:#30292d;
}

body.dark .top,
body.dark .bottom{
  background:#211e21ee;
}

body.dark .photo{
  background:linear-gradient(145deg,#30282c,#29272f);
}

body.dark .action{
  background:#211e21;
}

body.dark .input,
body.dark textarea{
  background:#211e21;
  color:white;
}

body.dark .chatbox{
  background:#191619;
}

body.dark .message.theirs{
  background:#322d31;
  color:white;
}

@media(max-width:520px){

  .grid{
    grid-template-columns:1fr;
  }

  .photo{
    height:350px;
  }

  .hero{
    padding-top:45px;
  }

}
</style>
</head>

<body>

<header class="top">

  <div class="logo">
    Lumi ♡
  </div>

  <button class="auth-btn"
          id="authBtn"
          onclick="handleAuth()">
    ورود
  </button>

</header>


<!-- HOME -->

<section id="home" class="page active">

  <div class="hero">

    <div class="hero-label">
      FIND YOUR CONNECTION
    </div>

    <h1>
      شاید اینجا
      <br>
      <span>آدم تو باشه.</span>
    </h1>

    <p>
      آدم‌های جدید رو کشف کن،
      ارتباط بساز و گفت‌وگو رو شروع کن.
    </p>

  </div>

  <div class="container">

    <div class="title">

      <h2>
        کشف
      </h2>

      <span class="muted" id="counter"></span>

    </div>

    <div id="discover"></div>

  </div>

</section>


<!-- MATCHES -->

<section id="matches" class="page">

  <div class="container">

    <div class="title">

      <h2>
        Match
      </h2>

      <span class="muted">
        ارتباط‌های دوطرفه
      </span>

    </div>

    <div id="matchesList"
         class="grid">
    </div>

  </div>

</section>


<!-- CHATS -->

<section id="chats" class="page">

  <div class="container">

    <div class="title">

      <h2>
        چت‌ها
      </h2>

    </div>

    <div id="chatList"></div>

  </div>

</section>


<!-- PROFILE -->

<section id="profile" class="page">

  <div class="container">

    <div class="title">

      <h2>
        پروفایل
      </h2>

    </div>

    <div id="myProfile"></div>


    <!-- SETTINGS INSIDE PROFILE -->

    <div class="box settings">

      <div class="settings-title">
        تنظیمات
      </div>

      <button class="setting"
              onclick="openEdit()">

        <span>
          ویرایش پروفایل
        </span>

        <span>
          ›
        </span>

      </button>


      <button class="setting"
              onclick="toggleDark()">

        <span>
          ظاهر
        </span>

        <span>
          ◐
        </span>

      </button>


      <button class="setting"
              onclick="toast('اعلان‌ها فعال هستند')">

        <span>
          اعلان‌ها
        </span>

        <span>
          ›
        </span>

      </button>


      <button class="setting"
              onclick="toast('تنظیمات حریم خصوصی')">

        <span>
          حریم خصوصی
        </span>

        <span>
          ›
        </span>

      </button>


      <button class="setting"
              onclick="toast('راهنمای Lumi')">

        <span>
          راهنما
        </span>

        <span>
          ›
        </span>

      </button>


      <button class="setting danger"
              onclick="logout()">

        <span>
          خروج از حساب
        </span>

        <span>
          ↗
        </span>

      </button>

    </div>

  </div>

</section>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button class="active"
          onclick="nav('home',this)">

    <span>
      ⌕
    </span>

    کشف

  </button>


  <button onclick="nav('matches',this)">

    <span>
      ♡
    </span>

    Match

  </button>


  <button onclick="nav('chats',this)">

    <span>
      ◌
    </span>

    چت

  </button>


  <button onclick="nav('profile',this)">

    <span>
      ◯
    </span>

    پروفایل

  </button>

</nav>


<!-- MODAL -->

<div class="modal"
     id="modal">

  <div class="sheet">

    <button class="close"
            onclick="closeModal()">

      ×

    </button>

    <div id="modalBody"></div>

  </div>

</div>


<div class="toast"
     id="toast">
</div>


<script>

/* =========================
   DATA
========================= */

const people = [

  {
    name:"سارا",
    age:24,
    city:"تهران",
    emoji:"👩🏻",
    bio:"عاشق موسیقی، سفر و کافه‌های دنج. دنبال آشنایی خوب و گفت‌وگوی جذابم.",
    tags:["موسیقی","سفر","کافه"]
  },

  {
    name:"آرین",
    age:26,
    city:"اصفهان",
    emoji:"👨🏻",
    bio:"فیلم، عکاسی و کشف جاهای جدید. همیشه برای یک گفت‌وگوی خوب آماده‌ام.",
    tags:["فیلم","عکاسی","کافه"]
  },

  {
    name:"نیلا",
    age:23,
    city:"شیراز",
    emoji:"👩🏼",
    bio:"کتاب، هنر و موسیقی. آدم‌های صمیمی و خوش‌صحبت رو دوست دارم.",
    tags:["کتاب","هنر","موسیقی"]
  },

  {
    name:"پارسا",
    age:28,
    city:"مشهد",
    emoji:"👨🏼",
    bio:"ورزش، سفر و تکنولوژی. دنبال یک ارتباط واقعی و محترمانه هستم.",
    tags:["ورزش","سفر","تکنولوژی"]
  }

];


/* =========================
   STATE
========================= */

let state =
JSON.parse(
  localStorage.getItem("lumiState")
  ||
  '{"i":0,"likes":[],"chats":{},"user":null}'
);


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "lumiState",
    JSON.stringify(state)
  );

}


/* =========================
   TOAST
========================= */

function toast(message){

  const t =
    document.getElementById("toast");

  t.innerText = message;

  t.classList.add("show");

  setTimeout(
    ()=>{
      t.classList.remove("show");
    },
    2000
  );

}


/* =========================
   NAVIGATION
========================= */

function nav(id,button){

  document
    .querySelectorAll(".page")
    .forEach(
      page =>
      page.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

  document
    .querySelectorAll(".bottom button")
    .forEach(
      btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  if(id==="home")
    renderDiscover();

  if(id==="matches")
    renderMatches();

  if(id==="chats")
    renderChats();

  if(id==="profile")
    renderProfile();

  window.scrollTo(0,0);

}


/* =========================
   DISCOVER
========================= */

function renderDiscover(){

  const box =
    document.getElementById("discover");

  const counter =
    document.getElementById("counter");


  if(state.i >= people.length){

    counter.innerText =
      people.length +
      " / " +
      people.length;

    box.innerHTML = `

      <div class="box center"
           style="padding:40px">

        <div style="font-size:48px">
          ♡
        </div>

        <h3 style="margin-top:12px">
          فعلاً همین بود
        </h3>

        <p class="muted">
          بعداً دوباره سر بزن.
        </p>

      </div>

    `;

    return;

  }


  const p =
    people[state.i];


  counter.innerText =
    (state.i + 1) +
    " / " +
    people.length;


  box.innerHTML = `

    <div class="card discover-card">

      <div class="photo">
        ${p.emoji}
      </div>

      <div class="info">

        <div class="name">
          ${p.name}، ${p.age}
        </div>

        <div class="meta">
          📍 ${p.city}
        </div>

        <div class="bio">
          ${p.bio}
        </div>

        <div class="tags">

          ${
            p.tags
              .map(
                tag =>
                `<span class="tag">${tag}</span>`
              )
              .join("")
          }

        </div>

      </div>

    </div>


    <div class="actions">

      <button
        class="action pass"
        onclick="pass()">

        ×

      </button>


      <button
        class="action star"
        onclick="superLike()">

        ★

      </button>


      <button
        class="action like"
        onclick="like()">

        ♥

      </button>

    </div>

  `;

}


/* =========================
   PASS
========================= */

function pass(){

  toast("پروفایل بعدی");

  state.i++;

  save();

  renderDiscover();

}


/* =========================
   LIKE
========================= */

function like(){

  const p =
    people[state.i];

  if(
    !state.likes
      .includes(p.name)
  ){

    state.likes.push(p.name);

  }

  save();

  toast("Like فرستاده شد ♥");

  state.i++;

  save();

  renderDiscover();

}


/* =========================
   SUPER LIKE
========================= */

function superLike(){

  const p =
    people[state.i];

  if(
    !state.likes
      .includes(p.name)
  ){

    state.likes.push(p.name);

  }

  save();

  toast("Super Like فرستاده شد ★");

  state.i++;

  save();

  renderDiscover();

}


/* =========================
   MATCHES
========================= */

function renderMatches(){

  const box =
    document.getElementById(
      "matchesList"
    );


  const matches =
    people.filter(
      p =>
      state.likes
        .includes(p.name)
    );


  if(!matches.length){

    box.innerHTML = `

      <div class="box center"
           style="padding:40px;grid-column:1/-1">

        <div style="font-size:45px">
          ♡
        </div>

        <p>
          هنوز Match نداری.
        </p>

      </div>

    `;

    return;

  }


  box.innerHTML =
    matches
      .map(
        p => `

        <div
          class="match"
          onclick="openChat('${p.name}')">

          <div class="avatar">
            ${p.emoji}
          </div>

          <div>

            <b>
              ${p.name}
            </b>

            <div class="muted">
              Match شده
            </div>

          </div>

        </div>

        `
      )
      .join("");

}


/* =========================
   CHAT LIST
========================= */

function renderChats(){

  const box =
    document.getElementById(
      "chatList"
    );


  const names =
    Object.keys(state.chats);


  if(!names.length){

    box.innerHTML = `

      <div class="box center"
           style="padding:40px">

        <div style="font-size:40px">
          ◌
        </div>

        <p>
          هنوز گفتگویی نداری.
        </p>

      </div>

    `;

    return;

  }


  box.innerHTML =
    names
      .map(
        name => {

          const p =
            people.find(
              x =>
              x.name === name
            )
            ||
            {
              emoji:"🙂"
            };


          const messages =
            state.chats[name];


          const last =
            messages[
              messages.length - 1
            ];


          return `

            <div
              class="chat"
              style="margin-bottom:10px"
              onclick="openChat('${name}')">

              <div class="avatar">
                ${p.emoji}
              </div>

              <div>

                <b>
                  ${name}
                </b>

                <div class="muted">
                  ${
                    last
                    ? last.text
                    : "شروع گفتگو"
                  }
                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================
   OPEN CHAT
========================= */

function openChat(name){

  const p =
    people.find(
      x =>
      x.name === name
    )
    ||
    {
      emoji:"🙂"
    };


  if(!state.chats[name]){

    state.chats[name] = [

      {
        mine:false,
        text:"سلام 👋 خوش اومدی به Lumi!"
      }

    ];

    save();

  }


  const messages =
    state.chats[name];


  document.getElementById(
    "modalBody"
  ).innerHTML = `

    <h2>
      ${p.emoji}
      ${name}
    </h2>

    <div
      class="chatbox"
      id="chatbox">

      ${
        messages
          .map(
            m => `

            <div
              class="message
              ${m.mine
                ? "mine"
                : "theirs"}">

              ${m.text}

            </div>

            `
          )
          .join("")
      }

    </div>


    <form
      class="row"
      style="margin-top:12px"
      onsubmit="sendMessage(event,'${name}')">

      <input
        id="messageInput"
        class="input"
        placeholder="پیامت رو بنویس..."
        autocomplete="off">

      <button
        class="primary"
        style="margin:0;width:auto;padding:12px 20px">

        ارسال

      </button>

    </form>

  `;


  document
    .getElementById("modal")
    .classList.add("show");


  setTimeout(
    ()=>{
      const chat =
        document.getElementById(
          "chatbox"
        );

      if(chat)
        chat.scrollTop =
          chat.scrollHeight;
    },
    50
  );

}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage(
  event,
  name
){

  event.preventDefault();


  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text)
    return;


  state.chats[name].push({

    mine:true,

    text:text

  });


  save();

  openChat(name);

  renderChats();

}


/* =========================
   PROFILE
========================= */

function renderProfile(){

  const box =
    document.getElementById(
      "myProfile"
    );


  if(!state.user){

    box.innerHTML = `

      <div class="box center"
           style="padding:35px">

        <div style="font-size:45px">
          ◯
        </div>

        <h3 style="margin-top:12px">
          هنوز حساب نداری
        </h3>

        <p class="muted">
          برای ساخت پروفایل ثبت‌نام کن.
        </p>

        <button
          class="primary"
          onclick="openAuth()">

          ثبت‌نام

        </button>

      </div>

    `;

    return;

  }


  const u =
    state.user;


  box.innerHTML = `

    <div class="box profile-box">

      <div class="profile-head">

        <div class="avatar">
          ${u.emoji || "◯"}
        </div>

        <div>

          <h3>
            ${u.name}، ${u.age}
          </h3>

          <p class="muted">
            📍 ${u.city}
          </p>

        </div>

      </div>


      <div class="bio">

        ${
          u.bio ||
          "هنوز چیزی درباره خودت ننوشتی."
        }

      </div>


      <div class="tags">

        ${
          (u.tags || [])
          .map(
            x =>
            `<span class="tag">${x}</span>`
          )
          .join("")
        }

      </div>


      <button
        class="primary"
        onclick="openEdit()">

        ویرایش پروفایل

      </button>

    </div>

  `;

}


/* =========================
   AUTH
========================= */

function handleAuth(){

  if(state.user){

    nav(
      "profile",
      document.querySelectorAll(
        ".bottom button"
      )[3]
    );

  }
  else{

    openAuth();

  }

}


function openAuth(){

  document.getElementById(
    "modalBody"
  ).innerHTML = `

    <h2>
      ثبت‌نام در Lumi
    </h2>

    <p class="muted">
      برای نسخه فعلی، اطلاعات فقط روی
      همین دستگاه ذخیره می‌شود.
    </p>


    <div class="form">

      <input
        id="name"
        class="input"
        placeholder="نام">


      <div class="row">

        <input
          id="age"
          class="input"
          type="number"
          placeholder="سن">


        <input
          id="city"
          class="input"
          placeholder="شهر">

      </div>


      <input
        id="email"
        class="input"
        type="email"
        placeholder="ایمیل">


      <input
        id="password"
        class="input"
        type="password"
        placeholder="رمز عبور">


      <button
        class="primary"
        onclick="signup()">

        ساخت حساب

      </button>

    </div>

  `;


  document
    .getElementById("modal")
    .classList.add("show");

}


/* =========================
   SIGN UP
========================= */

function signup(){

  const name =
    document
      .getElementById("name")
      .value.trim();


  const age =
    Number(
      document
        .getElementById("age")
        .value
    );


  const city =
    document
      .getElementById("city")
      .value.trim();


  const email =
    document
      .getElementById("email")
      .value.trim();


  const password =
    document
      .getElementById("password")
      .value;


  if(
    !name ||
    !city ||
    !email ||
    !password ||
    age < 18
  ){

    toast(
      "اطلاعات رو کامل وارد کن؛ سن باید ۱۸+ باشه."
    );

    return;

  }


  state.user = {

    name:name,

    age:age,

    city:city,

    email:email,

    password:password,

    bio:"",

    tags:[],

    emoji:"😎"

  };


  save();


  closeModal();

  updateAuthButton();

  renderProfile();


  toast(
    "حساب ساخته شد ♥"
  );

}


/* =========================
   EDIT PROFILE
========================= */

function openEdit(){

  if(!state.user){

    openAuth();

    return;

  }


  const u =
    state.user;


  document.getElementById(
    "modalBody"
  ).innerHTML = `

    <h2>
      ویرایش پروفایل
    </h2>


    <div class="form">

      <input
        id="editName"
        class="input"
        value="${u.name}"
        placeholder="نام">


      <input
        id="editCity"
        class="input"
        value="${u.city}"
        placeholder="شهر">


      <textarea
        id="editBio"
        rows="4"
        placeholder="درباره خودت..."
      >${u.bio || ""}</textarea>


      <input
        id="editTags"
        class="input"
        value="${(u.tags || []).join(", ")}"
        placeholder="علایق: موسیقی، سفر، فیلم">


      <button
        class="primary"
        onclick="saveProfile()">

        ذخیره تغییرات

      </button>

    </div>

  `;


  document
    .getElementById("modal")
    .classList.add("show");

}


/* =========================
   SAVE PROFILE
========================= */

function saveProfile(){

  state.user.name =
    document
      .getElementById("editName")
      .value.trim();


  state.user.city =
    document
      .getElementById("editCity")
      .value.trim();


  state.user.bio =
    document
      .getElementById("editBio")
      .value.trim();


  state.user.tags =
    document
      .getElementById("editTags")
      .value
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean);


  save();

  closeModal();

  renderProfile();

  toast(
    "پروفایل ذخیره شد"
  );

}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );


  localStorage.setItem(
    "lumiDark",
    document.body.classList.contains(
      "dark"
    )
  );


  toast(
    document.body.classList.contains(
      "dark"
    )
    ? "حالت تاریک"
    : "حالت روشن"
  );

}


/* =========================
   LOGOUT
========================= */

function logout(){

  state.user = null;

  save();

  updateAuthButton();

  renderProfile();

  toast(
    "از حساب خارج شدی"
  );

}


/* =========================
   MODAL
========================= */

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


/* =========================
   AUTH BUTTON
========================= */

function updateAuthButton(){

  document.getElementById(
    "authBtn"
  ).innerText =
    state.user
    ? "حساب من"
    : "ورود";

}


/* =========================
   START
========================= */

if(
  localStorage.getItem(
    "lumiDark"
  ) === "true"
){

  document.body.classList.add(
    "dark"
  );

}


updateAuthButton();

renderDiscover();

renderMatches();

renderChats();

renderProfile();

</script>

</body>
</html>
